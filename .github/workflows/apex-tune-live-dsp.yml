name: Tune Live portable DSP regression
on:
  pull_request:
    paths:
      - 'My DAW/DAW_Core/Source/TuneLiveCore/**'
      - 'My DAW/DAW_Core/Tests/TuneLive/**'
      - '.github/workflows/apex-tune-live-dsp.yml'
  push:
    branches: [feature/apex-tune-live-native-v1]
  workflow_dispatch:

# Only the newest PR head is worth expensive full-DSP tests.
# Rapid iterations previously queued many superseded runs.
concurrency:
  group: tune-live-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gcc-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned Signalsmith Stretch revision
        shell: bash
        run: |
          test "$(git -C "My DAW/DAW_Core/Source/ThirdParty/signalsmith-stretch" rev-parse HEAD)" = "57b93f4e9206a089a45387eaa39bdc9f310d3308"
      - name: Build with C++17 sanitizers and warnings as errors
        shell: bash
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            "My DAW/DAW_Core/Tests/TuneLive/test_yin.cpp" -o tune_live_yin_test
          ./tune_live_yin_test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            "My DAW/DAW_Core/Tests/TuneLive/test_voice_control.cpp" -o tune_live_voice_test
          ./tune_live_voice_test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            "My DAW/DAW_Core/Tests/TuneLive/test_presets.cpp" -o tune_live_preset_test
          ./tune_live_preset_test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            -I"My DAW/DAW_Core/Source/ThirdParty" \
            -I"My DAW/DAW_Core/Source/ThirdParty/signalsmith-stretch" \
            "My DAW/DAW_Core/Tests/TuneLive/test_wet_audio.cpp" -o tune_live_wet_test
          ./tune_live_wet_test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            -I"My DAW/DAW_Core/Source/ThirdParty" \
            -I"My DAW/DAW_Core/Source/ThirdParty/signalsmith-stretch" \
            "My DAW/DAW_Core/Tests/TuneLive/test_rt_matrix.cpp" -o tune_live_matrix_test
          ./tune_live_matrix_test
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            -I"My DAW/DAW_Core/Source/ThirdParty" \
            -I"My DAW/DAW_Core/Source/ThirdParty/signalsmith-stretch" \
            "My DAW/DAW_Core/Tests/TuneLive/test_no_alloc.cpp" -o tune_live_no_alloc_test
          ./tune_live_no_alloc_test
  msvc-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and enforce ALL portable DSP tests on MSVC (fail fast)
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:tune_live_yin_test.exe "My DAW/DAW_Core/Tests/TuneLive/test_yin.cpp" || exit /b 1
          tune_live_yin_test.exe || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:tune_live_voice_test.exe "My DAW/DAW_Core/Tests/TuneLive/test_voice_control.cpp" || exit /b 1
          tune_live_voice_test.exe || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:tune_live_preset_test.exe "My DAW/DAW_Core/Tests/TuneLive/test_presets.cpp" || exit /b 1
          tune_live_preset_test.exe || exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /I "My DAW/DAW_Core/Source/ThirdParty" /I "My DAW/DAW_Core/Source/ThirdParty/signalsmith-stretch" /Fe:tune_live_wet_test.exe "My DAW/DAW_Core/Tests/TuneLive/test_wet_audio.cpp" || exit /b 1
          tune_live_wet_test.exe || exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /I "My DAW/DAW_Core/Source/ThirdParty" /I "My DAW/DAW_Core/Source/ThirdParty/signalsmith-stretch" /Fe:tune_live_matrix_test.exe "My DAW/DAW_Core/Tests/TuneLive/test_rt_matrix.cpp" || exit /b 1
          tune_live_matrix_test.exe || exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /I "My DAW/DAW_Core/Source/ThirdParty" /I "My DAW/DAW_Core/Source/ThirdParty/signalsmith-stretch" /Fe:tune_live_no_alloc_test.exe "My DAW/DAW_Core/Tests/TuneLive/test_no_alloc.cpp" || exit /b 1
          tune_live_no_alloc_test.exe || exit /b 1
