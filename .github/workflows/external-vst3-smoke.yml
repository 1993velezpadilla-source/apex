name: External open-source VST3 smoke
on:
  push:
    paths:
      # CI must re-run real hosted VST3 canaries when APEX automation,
      # plugin host, or their regressions change (not just this workflow).
      - .github/workflows/external-vst3-smoke.yml
      - "My DAW/DAW_Core/Scripts/fetch_external_vst3.ps1"
      - "My DAW/DAW_Core/Scripts/run_apex_tests.ps1"
      - "My DAW/DAW_Core/Source/Automation/**"
      - "My DAW/DAW_Core/Source/AutomationCore/**"
      - "My DAW/DAW_Core/Source/PluginHostCore/**"
      - "My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/Automation*"
      - "My DAW/DAW_Core/Tests/Source/PluginHost/**"
      - "My DAW/DAW_Core/Tests/Source/Diagnostics/Automation*"
      - "My DAW/DAW_Core/Tests/Source/Arrangement/Automation*"
      - "My DAW/DAW_Core/Tests/Fixtures/VST3/**"
  pull_request:
    paths:
      # CI must re-run real hosted VST3 canaries when APEX automation,
      # plugin host, or their regressions change (not just this workflow).
      - .github/workflows/external-vst3-smoke.yml
      - "My DAW/DAW_Core/Scripts/fetch_external_vst3.ps1"
      - "My DAW/DAW_Core/Scripts/run_apex_tests.ps1"
      - "My DAW/DAW_Core/Source/Automation/**"
      - "My DAW/DAW_Core/Source/AutomationCore/**"
      - "My DAW/DAW_Core/Source/PluginHostCore/**"
      - "My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/Automation*"
      - "My DAW/DAW_Core/Tests/Source/PluginHost/**"
      - "My DAW/DAW_Core/Tests/Source/Diagnostics/Automation*"
      - "My DAW/DAW_Core/Tests/Source/Arrangement/Automation*"
      - "My DAW/DAW_Core/Tests/Fixtures/VST3/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apex-external-vst3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  real-vst3:
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: powershell
        working-directory: My DAW/DAW_Core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare pinned APEX test toolchain
        run: .\Scripts\prepare_ci.ps1
      - name: Download 5 SHA256-pinned MIT VST3 categories (reverb/delay/EQ/compressor/chorus)
        run: .\Scripts\fetch_external_vst3.ps1
      - name: Validate 5 real VST3 categories through generic APEX host
        run: .\Scripts\run_apex_tests.ps1 -Configuration ${{ matrix.configuration }} -Category ExternalVST3 -Seed 0xA9E12026
      - name: Preserve real-plugin test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-external-vst3-${{ matrix.configuration }}-${{ github.sha }}
          path: My DAW/DAW_Core/evidence/runs/
          if-no-files-found: warn
