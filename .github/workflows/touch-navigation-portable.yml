name: Touch Navigation Portable

on:
  pull_request:
    paths:
      - 'My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/TouchNavigationMath.h'
      - 'My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/ArrangementZoomCore.h'
      - 'My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/ArrangementRulerCore.cpp'
      - 'My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/WaveformPeakRangeIndexCore.h'
      - 'My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/ClipWaveformCacheCore.cpp'
      - 'My DAW/DAW_Core/Source/UICore/TrackPlaylistInlineLayoutCore.h'
      - 'My DAW/DAW_Core/Tests/Portable/ArrangementZoomPortableTests.cpp'
      - 'My DAW/DAW_Core/Tests/Portable/WaveformPeakRangePortableTests.cpp'
      - 'My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/ArrangementViewCore.cpp'
      - 'My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/ArrangementViewCore.h'
      - 'My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/ClipRenderCore.cpp'
      - 'My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/ClipRenderCore.h'
      - 'My DAW/DAW_Core/Tests/Portable/TouchNavigationMathPortableTests.cpp'
      - 'My DAW/DAW_Core/Tests/Portable/ApexRadialGeometryPortableTests.cpp'
      - 'My DAW/DAW_Core/Source/UICore/ApexRadialGeometry.h'
      - 'My DAW/DAW_Core/Source/UICore/ApexRadialContextMenu.h'
      - 'My DAW/DAW_Core/Source/UICore/ApexContextMenuStyle.h'
      - 'My DAW/DAW_Core/Source/UICore/SettingsPanel.h'
      - 'My DAW/DAW_Core/Source/UICore/TrackList.h'
      - 'My DAW/DAW_Core/Builds/VisualStudio2026/ArrangementEditor/ClipContextMenuCore.h'
      - '.github/workflows/touch-navigation-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test touch navigation math with C++17
        shell: bash
        run: |
          cd "My DAW/DAW_Core"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/Portable/TouchNavigationMathPortableTests.cpp -o /tmp/apex_touch_navigation_tests
          /tmp/apex_touch_navigation_tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/Portable/ApexRadialGeometryPortableTests.cpp -o /tmp/apex_radial_geometry_tests
          /tmp/apex_radial_geometry_tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/Portable/ArrangementZoomPortableTests.cpp -o /tmp/apex_arrangement_zoom_tests
          /tmp/apex_arrangement_zoom_tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/Portable/WaveformPeakRangePortableTests.cpp -o /tmp/apex_waveform_peak_range_tests
          /tmp/apex_waveform_peak_range_tests
