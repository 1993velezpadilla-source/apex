name: Pichy capability registry core

on:
  push:
    paths:
      - 'My DAW/DAW_Core/Source/PichyCore/**'
      - 'My DAW/DAW_Core/Tests/Portable/PichyCapabilityRegistryStandalone.cpp'
      - '.github/workflows/pichy-capability-registry.yml'
  pull_request:
    paths:
      - 'My DAW/DAW_Core/Source/PichyCore/**'
      - 'My DAW/DAW_Core/Tests/Portable/PichyCapabilityRegistryStandalone.cpp'
      - '.github/workflows/pichy-capability-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-schema:
    name: Pichy portable capability schema / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux C++17 bounded capability tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            "My DAW/DAW_Core/Tests/Portable/PichyCapabilityRegistryStandalone.cpp" \
            -o "${RUNNER_TEMP}/pichy_capability_registry"
          "${RUNNER_TEMP}/pichy_capability_registry"
      - name: Configure MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Windows MSVC /W4 /WX capability tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:pichy_capability_registry.exe "My DAW/DAW_Core/Tests/Portable/PichyCapabilityRegistryStandalone.cpp"
          if ($LASTEXITCODE -ne 0) { throw "Pichy C++17 compile failed" }
          ./pichy_capability_registry.exe
          if ($LASTEXITCODE -ne 0) { throw "Pichy capability test failed" }
