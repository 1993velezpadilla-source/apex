name: Tune Live causal sub-ms research (NOT shipping)
on:
  pull_request:
    paths:
      - 'My DAW/DAW_Core/Source/TuneLiveCore/Research/ApexTuneLiveHarmonicLivePrototype.h'
      - 'My DAW/DAW_Core/Tests/TuneLive/test_harmonic_live_research.cpp'
      - 'My DAW/DAW_Core/Tests/TuneLive/test_live_one_ms_transient.cpp'
      - 'My DAW/DAW_Core/Tests/TuneLive/test_causal_live_rt_no_alloc.cpp'
      - 'My DAW/DAW_Core/Tests/TuneLive/test_causal_live_note_leaps.cpp'
      - 'My DAW/DAW_Core/Tests/TuneLive/test_causal_fast_note_leaps.cpp'
      - '.github/workflows/tune-live-causal-subms-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: causal-research-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-address-undefined-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test actual production tracker + experimental synthesizer
        shell: bash
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            "My DAW/DAW_Core/Tests/TuneLive/test_harmonic_live_research.cpp" \
            -o tune_live_harmonic_research
          ./tune_live_harmonic_research | tee harmonic_research_ubuntu.log
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            "My DAW/DAW_Core/Tests/TuneLive/test_live_one_ms_transient.cpp" \
            -o tune_live_one_ms_transient
          ./tune_live_one_ms_transient | tee one_ms_transient_ubuntu.log
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            "My DAW/DAW_Core/Tests/TuneLive/test_causal_live_rt_no_alloc.cpp" \
            -o tune_live_causal_no_alloc
          ./tune_live_causal_no_alloc | tee causal_rt_no_alloc_ubuntu.log
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            "My DAW/DAW_Core/Tests/TuneLive/test_causal_live_note_leaps.cpp" \
            -o tune_live_causal_note_leaps
          ./tune_live_causal_note_leaps | tee causal_note_leaps_ubuntu.log
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            "My DAW/DAW_Core/Tests/TuneLive/test_causal_fast_note_leaps.cpp" \
            -o tune_live_causal_fast_leaps
          ./tune_live_causal_fast_leaps | tee causal_fast_leaps_ubuntu.log
      - name: Publish unedited diagnostic results, not a release certificate
        uses: actions/upload-artifact@v4
        with:
          name: tune-live-causal-harmonic-research-linux
          path: |
            harmonic_research_ubuntu.log
            one_ms_transient_ubuntu.log
            causal_rt_no_alloc_ubuntu.log
            causal_note_leaps_ubuntu.log
            causal_fast_leaps_ubuntu.log
          if-no-files-found: error
          retention-days: 14

  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: C++17 MSVC build and wet audio experiment
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /Fe:tune_live_harmonic_research.exe "My DAW/DAW_Core/Tests/TuneLive/test_harmonic_live_research.cpp" || exit /b 1
          tune_live_harmonic_research.exe > harmonic_research_windows.log || (type harmonic_research_windows.log & exit /b 1)
          type harmonic_research_windows.log
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /Fe:tune_live_one_ms_transient.exe "My DAW/DAW_Core/Tests/TuneLive/test_live_one_ms_transient.cpp" || exit /b 1
          tune_live_one_ms_transient.exe > one_ms_transient_windows.log || (type one_ms_transient_windows.log & exit /b 1)
          type one_ms_transient_windows.log
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /Fe:tune_live_causal_no_alloc.exe "My DAW/DAW_Core/Tests/TuneLive/test_causal_live_rt_no_alloc.cpp" || exit /b 1
          tune_live_causal_no_alloc.exe > causal_rt_no_alloc_windows.log || (type causal_rt_no_alloc_windows.log & exit /b 1)
          type causal_rt_no_alloc_windows.log
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /Fe:tune_live_causal_note_leaps.exe "My DAW/DAW_Core/Tests/TuneLive/test_causal_live_note_leaps.cpp" || exit /b 1
          tune_live_causal_note_leaps.exe > causal_note_leaps_windows.log || (type causal_note_leaps_windows.log & exit /b 1)
          type causal_note_leaps_windows.log
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /Fe:tune_live_causal_fast_leaps.exe "My DAW/DAW_Core/Tests/TuneLive/test_causal_fast_note_leaps.cpp" || exit /b 1
          tune_live_causal_fast_leaps.exe > causal_fast_leaps_windows.log || (type causal_fast_leaps_windows.log & exit /b 1)
          type causal_fast_leaps_windows.log
      - name: Publish measured windows diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: tune-live-causal-harmonic-research-windows
          path: |
            harmonic_research_windows.log
            one_ms_transient_windows.log
            causal_rt_no_alloc_windows.log
            causal_note_leaps_windows.log
            causal_fast_leaps_windows.log
          if-no-files-found: error
          retention-days: 14
