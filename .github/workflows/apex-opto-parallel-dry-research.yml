name: APEX Opto Parallel Dry PDC Research
on:
  push:
    paths:
      - ".github/workflows/apex-opto-parallel-dry-research.yml"
      - "My DAW/DAW_Core/Source/PluginHostCore/PluginParallelDryDelayResearchCore.h"
      - "My DAW/DAW_Core/Tests/Standalone/PluginParallelDryDelayResearchTests.cpp"
      - "My DAW/DAW_Core/Source/PDCCore/ProgrammeRoutePdcPlannerResearchCore.h"
      - "My DAW/DAW_Core/Tests/Standalone/ProgrammeRoutePdcPlannerResearchTests.cpp"
      - "My DAW/DAW_Core/Source/PDCCore/ProgrammeRoutePdcPreparedResearchCore.h"
      - "My DAW/DAW_Core/Tests/Standalone/ProgrammeRoutePdcPreparedResearchTests.cpp"
      - "My DAW/DAW_Core/Source/PDCCore/ProgrammeEdgeRetimingResearchCore.h"
      - "My DAW/DAW_Core/Tests/Standalone/ProgrammeEdgeRetimingResearchTests.cpp"
  pull_request:
    paths:
      - ".github/workflows/apex-opto-parallel-dry-research.yml"
      - "My DAW/DAW_Core/Source/PluginHostCore/PluginParallelDryDelayResearchCore.h"
      - "My DAW/DAW_Core/Tests/Standalone/PluginParallelDryDelayResearchTests.cpp"
      - "My DAW/DAW_Core/Source/PDCCore/ProgrammeRoutePdcPlannerResearchCore.h"
      - "My DAW/DAW_Core/Tests/Standalone/ProgrammeRoutePdcPlannerResearchTests.cpp"
      - "My DAW/DAW_Core/Source/PDCCore/ProgrammeRoutePdcPreparedResearchCore.h"
      - "My DAW/DAW_Core/Tests/Standalone/ProgrammeRoutePdcPreparedResearchTests.cpp"
      - "My DAW/DAW_Core/Source/PDCCore/ProgrammeEdgeRetimingResearchCore.h"
      - "My DAW/DAW_Core/Tests/Standalone/ProgrammeEdgeRetimingResearchTests.cpp"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-pdc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: "Standalone dry PDC / ${{ matrix.os }}"
    steps:
      - uses: actions/checkout@v4
      - name: Linux C++17 ASAN/UBSAN dry-delay contract
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "My DAW/DAW_Core/Tests/Standalone/PluginParallelDryDelayResearchTests.cpp" \
            -o /tmp/apex-dry-pdc
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 /tmp/apex-dry-pdc
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "My DAW/DAW_Core/Tests/Standalone/ProgrammeRoutePdcPlannerResearchTests.cpp" \
            -o /tmp/apex-route-pdc
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 /tmp/apex-route-pdc
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "My DAW/DAW_Core/Tests/Standalone/ProgrammeRoutePdcPreparedResearchTests.cpp" \
            -o /tmp/apex-route-processed
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 /tmp/apex-route-processed
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "My DAW/DAW_Core/Tests/Standalone/ProgrammeEdgeRetimingResearchTests.cpp" \
            -o /tmp/apex-edge-retime
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 /tmp/apex-edge-retime
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Windows MSVC C++17 dry-delay contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /Fe:apex-dry-pdc.exe "My DAW/DAW_Core/Tests/Standalone/PluginParallelDryDelayResearchTests.cpp"
          if ($LASTEXITCODE -ne 0) { throw "MSVC dry PDC compile failed" }
          ./apex-dry-pdc.exe
          if ($LASTEXITCODE -ne 0) { throw "MSVC dry PDC tests failed" }
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /Fe:apex-route-pdc.exe "My DAW/DAW_Core/Tests/Standalone/ProgrammeRoutePdcPlannerResearchTests.cpp"
          if ($LASTEXITCODE -ne 0) { throw "MSVC routing DAG PDC compile failed" }
          ./apex-route-pdc.exe
          if ($LASTEXITCODE -ne 0) { throw "MSVC routing DAG PDC tests failed" }
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /Fe:apex-route-processed.exe "My DAW/DAW_Core/Tests/Standalone/ProgrammeRoutePdcPreparedResearchTests.cpp"
          if ($LASTEXITCODE -ne 0) { throw "MSVC prepared route audio test compile failed" }
          ./apex-route-processed.exe
          if ($LASTEXITCODE -ne 0) { throw "MSVC prepared route audio test failed" }
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /Fe:apex-edge-retime.exe "My DAW/DAW_Core/Tests/Standalone/ProgrammeEdgeRetimingResearchTests.cpp"
          if ($LASTEXITCODE -ne 0) { throw "MSVC atomic edge retiming compile failed" }
          ./apex-edge-retime.exe
          if ($LASTEXITCODE -ne 0) { throw "MSVC atomic edge retiming test failed" }
