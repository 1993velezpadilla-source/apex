name: Windows build and tests
# Release is the shipping gate. A separate Debug diagnostics workflow runs
# after MAIN Release succeeds, or on explicit manual request, so an optional
# debug probe cannot block a verified production artifact.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apex-windows-release-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
    defaults:
      run:
        shell: powershell
        working-directory: My DAW/DAW_Core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Repository and evidence contracts
        run: |
          .\Scripts\test_repository_policy.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\Scripts\test_validate_test_evidence.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\Scripts\test_test_result_tools.ps1
      - name: Download and verify pinned dependencies
        run: .\Scripts\prepare_ci.ps1
      - name: Build application without signing
        run: .\Scripts\build_apex.ps1 -Configuration ${{ matrix.configuration }} -Rebuild -Unsigned
      - name: Verify procedural Evo Eye boot GUI and absence of raster assets
        run: .\Scripts\test_evo_eye_procedural.ps1 -Configuration ${{ matrix.configuration }}
      - name: Capture real vector-animated Evo Eye open and closed frames
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = ".\\Builds\\VisualStudio2026\\x64\\${{ matrix.configuration }}\\App\\DAW_Core.exe"
          $source = Join-Path $env:TEMP 'apex-evo-eye-procedural'
          $dest = Join-Path $PWD 'evidence\\boot'
          # Never allow stale output from an earlier run to count as success.
          if (Test-Path -LiteralPath $source) {
            Remove-Item -LiteralPath $source -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Start-Process -Wait waits for child processes too; Debug can leave a
          # descendant running after the screenshot process itself has exited.
          # Wait for the actual process only and bound it to avoid blocking the
          # remaining Debug test suite and artifact publication for two hours.
          Write-Host "[EVO EYE CI] Starting ${{ matrix.configuration }} process with 90s timeout."
          $proc = Start-Process -FilePath $exe -ArgumentList '--apex-ci-evo-eye-frames' -PassThru
          try {
            if (-not $proc.WaitForExit(90000)) {
              foreach ($frame in @('open.png', 'closed.png')) {
                $from = Join-Path $source $frame
                Write-Host "[EVO EYE CI] Timeout evidence $frame exists: $(Test-Path -LiteralPath $from -PathType Leaf)"
              }
              throw "Evo Eye ${{ matrix.configuration }} diagnostic process timed out after 90s (pid $($proc.Id))."
            }
            Write-Host "[EVO EYE CI] Process exited with code $($proc.ExitCode)."
            if ($proc.ExitCode -ne 0) { throw "Evo Eye frame capture failed ($($proc.ExitCode))" }
            foreach ($frame in @('open.png', 'closed.png')) {
              $from = Join-Path $source $frame
              if (-not (Test-Path -LiteralPath $from -PathType Leaf)) { throw "Missing Evo Eye screenshot: $from" }
              Copy-Item -LiteralPath $from -Destination (Join-Path $dest $frame) -Force
            }
          }
          finally {
            if (-not $proc.HasExited) {
              # Only the timed-out CI diagnostic subprocess is terminated,
              # never the real user's splash or the normal app lifecycle.
              & taskkill.exe /PID $proc.Id /T /F 2>&1 | Out-Host
            }
            $proc.Dispose()
          }
      - name: Publish rendered Evo Eye C++ GUI previews
        uses: actions/upload-artifact@v4
        with:
          name: Apex-EvoEye-Frames-${{ matrix.configuration }}-${{ github.sha }}
          path: My DAW/DAW_Core/evidence/boot/*.png
          if-no-files-found: error
      - name: Exercise arranger scrolling and both zoom axes in the Windows EXE
        if: github.head_ref == 'feature/mobile-portrait-zoom-rewrite' || github.ref_name == 'feature/mobile-portrait-zoom-rewrite'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '.\Builds\VisualStudio2026\x64\Release\App\DAW_Core.exe').Path
          $out = (New-Item -ItemType Directory -Force -Path 'evidence\timeline-navigation').FullName
          foreach ($scene in @('clip', 'deep', 'playback')) {
            $modes = if ($scene -eq 'playback') { @('optimized') } else { @('reference', 'optimized') }
            foreach ($mode in $modes) {
              $env:APEX_TIMELINE_NAV_REPORT = Join-Path $out "$scene-$mode.json"
              Remove-Item -LiteralPath $env:APEX_TIMELINE_NAV_REPORT -ErrorAction SilentlyContinue
              $arguments = @('--apex-ci-timeline-navigation')
              if ($scene -eq 'deep') { $arguments += '--timeline-deep' }
              if ($scene -eq 'playback') { $arguments += '--timeline-playing' }
              if ($mode -eq 'reference') { $arguments += '--timeline-reference' }
              $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
              try {
                if (-not $process.WaitForExit(45000)) { throw "Arranger replay timed out: $scene $mode" }
                if (-not (Test-Path -LiteralPath $env:APEX_TIMELINE_NAV_REPORT)) {
                  throw "Missing real Windows arranger measurements: $scene $mode"
                }
                $result = Get-Content -Raw -LiteralPath $env:APEX_TIMELINE_NAV_REPORT | ConvertFrom-Json
                if ($process.ExitCode -ne 0 -or $result.error -or $result.phases.Count -ne 8) {
                  throw "Windows arranger replay failed: $scene $mode $($result.error)"
                }
                Write-Host "Real Windows arranger passed all navigation phases: $scene $mode"
              }
              finally {
                if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
                $process.Dispose()
              }
            }
          }
      - name: Upload Windows arranger runtime measurements
        if: always() && (github.head_ref == 'feature/mobile-portrait-zoom-rewrite' || github.ref_name == 'feature/mobile-portrait-zoom-rewrite')
        uses: actions/upload-artifact@v4
        with:
          name: APEX-Windows-Arranger-Navigation-${{ github.sha }}
          path: My DAW/DAW_Core/evidence/timeline-navigation/*.json
          if-no-files-found: warn
      - name: Upload Windows arranger preview executable
        if: github.head_ref == 'feature/mobile-portrait-zoom-rewrite' || github.ref_name == 'feature/mobile-portrait-zoom-rewrite'
        uses: actions/upload-artifact@v4
        with:
          name: APEX-Zoom-Rewrite-Windows-x64-${{ github.sha }}
          path: My DAW/DAW_Core/Builds/VisualStudio2026/x64/Release/App/DAW_Core.exe
          if-no-files-found: error
          retention-days: 14
      - name: Run complete test suite
        run: .\Scripts\run_apex_tests.ps1 -Configuration ${{ matrix.configuration }} -Seed 0xA9E12026
      - name: Smoke real APEX GUI and project automation persistence
        run: .\Scripts\smoke_apex_app_launch.ps1 -Configuration ${{ matrix.configuration }}
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-evidence-${{ matrix.configuration }}-${{ github.sha }}
          path: My DAW/DAW_Core/evidence/runs/
          if-no-files-found: warn
      - name: Publish verified application build
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Windows-${{ matrix.configuration }}-${{ github.sha }}
          path: |
            My DAW/DAW_Core/Builds/VisualStudio2026/x64/${{ matrix.configuration }}/App/DAW_Core.exe
            My DAW/DAW_Core/Builds/VisualStudio2026/x64/${{ matrix.configuration }}/App/DAW_Core.pdb
          if-no-files-found: error
