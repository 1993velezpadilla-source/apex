name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apex-windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: powershell
        working-directory: My DAW/DAW_Core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Repository and evidence contracts
        run: |
          .\Scripts\test_repository_policy.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\Scripts\test_validate_test_evidence.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\Scripts\test_test_result_tools.ps1
      - name: Download and verify pinned dependencies
        run: .\Scripts\prepare_ci.ps1
      - name: Build application without signing
        run: .\Scripts\build_apex.ps1 -Configuration ${{ matrix.configuration }} -Rebuild -Unsigned
      - name: Verify procedural Evo Eye boot GUI and absence of raster assets
        run: .\Scripts\test_evo_eye_procedural.ps1 -Configuration ${{ matrix.configuration }}
      - name: Capture real vector-animated Evo Eye open and closed frames
        run: |
          $exe = ".\\Builds\\VisualStudio2026\\x64\\${{ matrix.configuration }}\\App\\DAW_Core.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList '--apex-ci-evo-eye-frames' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Evo Eye frame capture failed ($($proc.ExitCode))" }
          $source = Join-Path $env:TEMP 'apex-evo-eye-procedural'
          $dest = Join-Path $PWD 'evidence\\boot'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($frame in @('open.png', 'closed.png')) {
            $from = Join-Path $source $frame
            if (-not (Test-Path -LiteralPath $from -PathType Leaf)) { throw "Missing Evo Eye screenshot: $from" }
            Copy-Item -LiteralPath $from -Destination (Join-Path $dest $frame) -Force
          }
      - name: Publish rendered Evo Eye C++ GUI previews
        uses: actions/upload-artifact@v4
        with:
          name: Apex-EvoEye-Frames-${{ matrix.configuration }}-${{ github.sha }}
          path: My DAW/DAW_Core/evidence/boot/*.png
          if-no-files-found: error
      - name: Run complete test suite
        env:
          APEX_REVERIE_CAPTURE_PNG: ${{ runner.temp }}\apex-reverie-real-gui-${{ matrix.configuration }}.png
        run: .\Scripts\run_apex_tests.ps1 -Configuration ${{ matrix.configuration }} -Seed 0xA9E12026
      - name: Publish authentic APEX Reverie JUCE GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Reverie-Real-GUI-${{ matrix.configuration }}-${{ github.sha }}
          path: ${{ runner.temp }}/apex-reverie-real-gui-${{ matrix.configuration }}.png
          if-no-files-found: warn
      - name: Smoke real APEX GUI and project automation persistence
        run: .\Scripts\smoke_apex_app_launch.ps1 -Configuration ${{ matrix.configuration }}
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-evidence-${{ matrix.configuration }}-${{ github.sha }}
          path: My DAW/DAW_Core/evidence/runs/
          if-no-files-found: warn
      - name: Publish verified application build
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Windows-${{ matrix.configuration }}-${{ github.sha }}
          path: |
            My DAW/DAW_Core/Builds/VisualStudio2026/x64/${{ matrix.configuration }}/App/DAW_Core.exe
            My DAW/DAW_Core/Builds/VisualStudio2026/x64/${{ matrix.configuration }}/App/DAW_Core.pdb
          if-no-files-found: error
