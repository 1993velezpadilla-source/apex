name: APEX Bubblegum Limiter DSP and native integration
on:
  push:
    paths:
      - "My DAW/DAW_Core/Source/LimiterCore/**"
      - "My DAW/DAW_Core/Source/PluginHostCore/ApexNativePluginFormat.h"
      - "My DAW/DAW_Core/Tests/Standalone/ApexBubblegumLimiterTests.cpp"
      - ".github/workflows/apex-limiter-core.yml"
  pull_request:
    paths:
      - "My DAW/DAW_Core/Source/LimiterCore/**"
      - "My DAW/DAW_Core/Source/PluginHostCore/ApexNativePluginFormat.h"
      - "My DAW/DAW_Core/Tests/Standalone/ApexBubblegumLimiterTests.cpp"
      - ".github/workflows/apex-limiter-core.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portable-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: My DAW/DAW_Core
    steps:
      - uses: actions/checkout@v4
      - name: Build DSP tests with ASAN/UBSAN
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            Tests/Standalone/ApexBubblegumLimiterTests.cpp -o /tmp/apex-limiter-tests
      - name: Run DSP gates
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: /tmp/apex-limiter-tests
  windows-app:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        working-directory: My DAW/DAW_Core
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true
      - name: Prepare dependencies
        run: .\Scripts\prepare_ci.ps1
      - name: Build APEX x64 Release with native limiter
        run: .\Scripts\build_apex.ps1 -Configuration Release -Rebuild -Unsigned
      - name: Render REAL compiled JUCE limiter plugin (no generated/mock images)
        run: .\Scripts\run_apex_tests.ps1 -Configuration Release -Category APEX.LimiterPreview -Seed 0xA9E12026
      - name: Preserve image bytes as base64 for authenticated visual auditing
        if: always()
        working-directory: .
        shell: pwsh
        run: |
          $folder = 'My DAW/DAW_Core/evidence/renderpacks/APEX_LIMITER_NATIVE'
          foreach ($file in @(Get-ChildItem -LiteralPath $folder -Filter '*.png' -File -ErrorAction SilentlyContinue)) {
            $base64 = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($file.FullName))
            [System.IO.File]::WriteAllText(($file.FullName + '.b64'), $base64)
          }
      - name: Upload actual JUCE GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-limiter-actual-compiled-juce-gui
          path: My DAW/DAW_Core/evidence/renderpacks/APEX_LIMITER_NATIVE/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve actual compiled screenshot in PR branch for visual review
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/apex-bubblegum-limiter-v1-20261022' }}
        working-directory: .
        shell: pwsh
        run: |
          $folder = 'My DAW/DAW_Core/evidence/renderpacks/APEX_LIMITER_NATIVE'
          $files = @(Get-ChildItem -LiteralPath $folder -Filter '*.png' -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'No real JUCE image was generated; do not publish invented evidence' }
          git config user.name 'APEX CI Visual Evidence'
          git config user.email 'apex-ci-visual-evidence@users.noreply.github.com'
          git add -f -- "$folder/*.png" "$folder/*.png.b64"
          $staged = git diff --cached --name-only
          if ($staged) {
            $target='refs/heads/feature/apex-bubblegum-limiter-v1-20261022'
            $remote=git ls-remote origin $target
            if ($LASTEXITCODE -ne 0 -or -not $remote) { throw 'Cannot verify screenshot target head' }
            $remoteSha=($remote -split '\s+')[0]
            if ($remoteSha -ne $env:GITHUB_SHA) {
              Write-Warning "Newer code $remoteSha replaced checked-out $env:GITHUB_SHA; skip stale captures (artifact retained)."
            } else {
              git commit -m 'evidence(limiter): store actual JUCE editor captures from Windows CI [skip ci]'
              if ($LASTEXITCODE -ne 0) { throw 'Screenshot commit failed' }
              git push origin HEAD:$target
              if ($LASTEXITCODE -ne 0) {
                $newHead=git ls-remote origin $target
                if ($LASTEXITCODE -eq 0 -and $newHead -and (($newHead -split '\s+')[0] -ne $env:GITHUB_SHA)) {
                  Write-Warning 'Branch advanced during screenshot push; immutable evidence artifact retained.'
                } else {
                  throw 'Screenshot push failed for reasons other than concurrent code updates'
                }
              }
            }
          }
      - name: Exercise standard APEX native tests
        run: .\Scripts\run_apex_tests.ps1 -Configuration Release -Seed 0xA9E12026
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-limiter-native-evidence
          path: My DAW/DAW_Core/evidence/runs/
          if-no-files-found: warn
