name: APEX Limiter 1x-32x CPU audit
on:
  push:
    paths:
      - "My DAW/DAW_Core/Tests/Standalone/ApexLimiterOversamplingBench.cpp"
      - "My DAW/DAW_Core/Tests/Standalone/ApexLimiterFirParity.cpp"
      - "My DAW/DAW_Core/Tests/Standalone/ApexLimiterWetPhaseAudit.cpp"
      - "My DAW/DAW_Core/Tests/Standalone/ApexLimiterTruePeakStress.cpp"
      - "My DAW/DAW_Core/Tests/Standalone/ApexLimiterTruePeakReference.h"
      - "My DAW/DAW_Core/Source/LimiterCore/ApexLimiterCore.h"
      - "My DAW/DAW_Core/Source/LimiterCore/ApexLimiterOversampling.h"
      - "My DAW/DAW_Core/Source/LimiterCore/ApexLimiterTruePeakReserve.h"
      - ".github/workflows/apex-limiter-perf.yml"
  pull_request:
    paths:
      - "My DAW/DAW_Core/Tests/Standalone/ApexLimiterOversamplingBench.cpp"
      - "My DAW/DAW_Core/Tests/Standalone/ApexLimiterFirParity.cpp"
      - "My DAW/DAW_Core/Tests/Standalone/ApexLimiterWetPhaseAudit.cpp"
      - "My DAW/DAW_Core/Tests/Standalone/ApexLimiterTruePeakStress.cpp"
      - "My DAW/DAW_Core/Tests/Standalone/ApexLimiterTruePeakReference.h"
      - "My DAW/DAW_Core/Source/LimiterCore/ApexLimiterCore.h"
      - "My DAW/DAW_Core/Source/LimiterCore/ApexLimiterOversampling.h"
      - "My DAW/DAW_Core/Source/LimiterCore/ApexLimiterTruePeakReserve.h"
      - ".github/workflows/apex-limiter-perf.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditable-cpu-ratios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: My DAW/DAW_Core
    steps:
      - uses: actions/checkout@v4
      - name: Compile native high-rate DSP timing harness
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic -Werror \
            -fno-fast-math Tests/Standalone/ApexLimiterOversamplingBench.cpp \
            -o "$RUNNER_TEMP/apex-limiter-os-bench"
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic -Werror \
            -fno-fast-math -DAPEX_LIMITER_OS_REFERENCE_FIR \
            Tests/Standalone/ApexLimiterOversamplingBench.cpp \
            -o "$RUNNER_TEMP/apex-limiter-os-bench-reference"
      - name: Measure real CPU cost at 48 kHz stereo
        run: |
          "$RUNNER_TEMP/apex-limiter-os-bench" | tee "$RUNNER_TEMP/apex-limiter-os-perf.csv"
          "$RUNNER_TEMP/apex-limiter-os-bench-reference" > "$RUNNER_TEMP/apex-limiter-os-reference.csv"
          echo '--- 32x reference FIR vs optimized FIR (shared CI: diagnostic only) ---'
          grep '^APEX_OS_CPU,32,' "$RUNNER_TEMP/apex-limiter-os-perf.csv"
          grep '^APEX_OS_CPU,32,' "$RUNNER_TEMP/apex-limiter-os-reference.csv"
          grep '^APEX_OS_MULTI,32,' "$RUNNER_TEMP/apex-limiter-os-perf.csv"
          grep '^APEX_OS_MULTI,32,' "$RUNNER_TEMP/apex-limiter-os-reference.csv"
      - name: Build numerical FIR A/B sample parity harness
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -fno-fast-math Tests/Standalone/ApexLimiterFirParity.cpp \
            -o "$RUNNER_TEMP/apex-limiter-fir-optimized"
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -fno-fast-math -DAPEX_LIMITER_OS_REFERENCE_FIR \
            Tests/Standalone/ApexLimiterFirParity.cpp \
            -o "$RUNNER_TEMP/apex-limiter-fir-reference"
      - name: Prove symmetric FIR output parity against original reference
        run: |
          "$RUNNER_TEMP/apex-limiter-fir-optimized" > "$RUNNER_TEMP/apex-fir-optimized.csv"
          "$RUNNER_TEMP/apex-limiter-fir-reference" > "$RUNNER_TEMP/apex-fir-reference.csv"
          python3 - "$RUNNER_TEMP/apex-fir-reference.csv" "$RUNNER_TEMP/apex-fir-optimized.csv" <<'PY'
          import itertools, math, sys
          rows=0
          maximum=0.0
          with open(sys.argv[1], encoding="utf-8") as reference, open(sys.argv[2], encoding="utf-8") as optimized:
              for rows,(old,new) in enumerate(itertools.zip_longest(reference,optimized),1):
                  if old is None or new is None:
                      raise SystemExit("APEX FIR parity: output row count mismatch")
                  a=old.strip().split(",")
                  b=new.strip().split(",")
                  if len(a)!=6 or len(b)!=6 or a[:4]!=b[:4]:
                      raise SystemExit(f"APEX FIR parity: metadata mismatch at row {rows}")
                  for channel in (4,5):
                      x,y=float(a[channel]),float(b[channel])
                      if not (math.isfinite(x) and math.isfinite(y)):
                          raise SystemExit(f"APEX FIR parity: nonfinite output at row {rows}")
                      delta=abs(x-y)
                      maximum=max(maximum,delta)
                      if delta>5e-6:
                          raise SystemExit(f"APEX FIR parity regression: row={rows} channel={channel} delta={delta}")
          if rows!=6*3*2*4096:
              raise SystemExit(f"APEX FIR parity: unexpected row count {rows}")
          report=f"APEX_FIR_PARITY_OK,rows={rows},max_absolute_difference={maximum:.9g}"
          print(report)
          with open(sys.argv[2].replace("optimized.csv","parity-summary.txt"),"w",encoding="utf-8") as out:
              out.write(report+"\\n")
          PY
      - name: Compile actual wet audio phase / PDC probe
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -fno-fast-math Tests/Standalone/ApexLimiterWetPhaseAudit.cpp \
            -o "$RUNNER_TEMP/apex-limiter-wet-phase"
      - name: Measure five-band wet-path phase, attenuation and PDC
        run: |
          "$RUNNER_TEMP/apex-limiter-wet-phase" | tee "$RUNNER_TEMP/apex-limiter-wet-phase.csv"
          grep '^APEX_WET_PHASE,32,' "$RUNNER_TEMP/apex-limiter-wet-phase.csv"
      - name: Compile independently reconstructed ISP stress audit
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -fno-fast-math Tests/Standalone/ApexLimiterTruePeakStress.cpp \
            -o "$RUNNER_TEMP/apex-limiter-truepeak-stress"
      - name: Measure actual nonlinear gain reduction and 32x ISP overshoots
        run: |
          "$RUNNER_TEMP/apex-limiter-truepeak-stress" | tee "$RUNNER_TEMP/apex-limiter-truepeak.csv"
          grep '^APEX_TRUEPEAK_SUMMARY,' "$RUNNER_TEMP/apex-limiter-truepeak.csv"
      - name: Write non-certifying benchmark summary
        if: always()
        run: |
          {
            echo '## APEX 1x-32x CPU cost at 48 kHz stereo'
            echo 'Measured on a shared GitHub runner, not target hardware.'
            echo 'A ratio >1 indicates the run took longer than realtime; under 1 alone **does not** certify dropout-safe audio playback.'
            echo 'No timing requirement is hard-gated by this job.'
            echo 'The standalone program deliberately bypasses JUCE overhead and external VST load.'
            echo ''
            if test -f "$RUNNER_TEMP/apex-limiter-os-perf.csv"; then
              echo '\`\`\`'
              cat "$RUNNER_TEMP/apex-limiter-os-perf.csv"
              echo '\`\`\`'
              echo ''
              echo '### Original reference FIR CPU cost for the same 1x–32x tests'
              echo '\`\`\`'
              cat "$RUNNER_TEMP/apex-limiter-os-reference.csv"
              echo '\`\`\`'
              cat "$RUNNER_TEMP/apex-fir-parity-summary.txt" 2>/dev/null || true
            else
              echo 'Benchmark data missing; see job logs.'
            fi
            echo ''
            echo '### Wet-path phase / PDC diagnostic'
            echo 'Actual Core + 1x-32x audio converter; multitone sine lock-in at 504 Hz, 4/8/16/20 kHz.'
            echo 'A green diagnostic run is NOT proof of zero phase error or certified PDC.'
            if test -f "$RUNNER_TEMP/apex-limiter-wet-phase.csv"; then
              echo '\`\`\`'
              cat "$RUNNER_TEMP/apex-limiter-wet-phase.csv"
              echo '\`\`\`'
            else
              echo 'Wet phase measurements unavailable.'
            fi
            echo ''
            echo '### Nonlinear 44.1/48/96 kHz true-peak stress (independent offline 32x comparator)'
            echo 'This probe reports TP OVERshoots instead of hiding them behind a green executable. No BS.1770 certification.'
            echo 'Audio TP ON applies a factor-specific experimental guard band before upsampled limiting. Final sample ceiling remains user-selected.'
            if test -f "$RUNNER_TEMP/apex-limiter-truepeak.csv"; then
              echo '\`\`\`'
              cat "$RUNNER_TEMP/apex-limiter-truepeak.csv"
              echo '\`\`\`'
            else
              echo 'TP stress data missing.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain measured CPU CSV for adversarial QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-limiter-1x-32x-measured-cpu
          path: |
            ${{ runner.temp }}/apex-limiter-os-perf.csv
            ${{ runner.temp }}/apex-limiter-os-reference.csv
            ${{ runner.temp }}/apex-fir-parity-summary.txt
            ${{ runner.temp }}/apex-limiter-wet-phase.csv
            ${{ runner.temp }}/apex-limiter-truepeak.csv
          retention-days: 30
          if-no-files-found: warn
