<script>
(function() {
  const strips = document.querySelectorAll('[data-strip]');
  let selected = '1';
  let t0 = performance.now();

  function apply() {
    strips.forEach(s => {
      const id = s.dataset.strip;
      const aura = s.querySelector('.aura');
      const pane = s.querySelector('.pane');
      if (id === selected && id !== 'master') {
        if (aura) { aura.style.transition = 'opacity 380ms cubic-bezier(0.22, 0.61, 0.36, 1)'; aura.style.opacity = '1'; }
        if (pane) pane.style.borderColor = 'rgba(248,224,168,0.5)';
      } else if (id !== 'master') {
        if (aura) { aura.style.transition = 'opacity 280ms cubic-bezier(0.22, 0.61, 0.36, 1)'; aura.style.opacity = '0'; }
        if (pane) pane.style.borderColor = 'rgba(255,255,255,0.16)';
      }
    });
  }

  strips.forEach(s => {
    if (s.dataset.strip !== 'master') {
      s.addEventListener('click', () => { selected = s.dataset.strip; apply(); });
    }
  });

  function drift(now) {
    const t = (now - t0) / 1000;
    strips.forEach(s => {
      const aura = s.querySelector('.aura');
      if (!aura || aura.style.opacity === '0') return;
      const x = Math.sin(t * 0.7) * 6;
      const y = Math.sin(t * 0.5 + 1.2) * 9;
      const o = 0.85 + 0.15 * (0.5 + 0.5 * Math.sin(t * 0.45));
      aura.style.transform = `translate(${x}px, ${y}px)`;
      aura.style.opacity = o.toFixed(3);
    });
    requestAnimationFrame(drift);
  }

  apply();
  requestAnimationFrame(drift);
})();
</script>
